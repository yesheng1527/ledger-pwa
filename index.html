<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#bde6f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>海风小账本</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        if (!('serviceWorker' in navigator)) return;
        const cleanupMessage = 'ledger-pwa-cache-cleared-20260801';
        const reloadKey = 'ledger-pwa-cache-cleanup-20260801';

        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data !== cleanupMessage || sessionStorage.getItem(reloadKey)) return;
          sessionStorage.setItem(reloadKey, 'done');
          location.reload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./service-worker.js?v=cleanup-20260801', { updateViaCache: 'none' })
            .then((registration) => registration.update())
            .catch(() => undefined);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
