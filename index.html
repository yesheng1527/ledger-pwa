<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#72cdd2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="海风记账" />
    <title>海风小账本</title>
    <link rel="manifest" href="/ledger-pwa/manifest.webmanifest?v=20260804" />
    <link rel="apple-touch-icon" sizes="180x180" href="/ledger-pwa/icons/apple-touch-icon-seabreeze.png?v=20260804" />
    <link rel="icon" sizes="192x192" href="/ledger-pwa/icons/icon-192-seabreeze.png?v=20260804" type="image/png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        if (!('serviceWorker' in navigator)) return;
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./service-worker.js?v=20260808', { updateViaCache: 'none' })
            .then((registration) => registration.update())
            .catch(() => undefined);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
